name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Download Code
        uses: actions/checkout@v4
        
      - name: 2. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          
      - name: 3. Install Libraries
        run: pip install -r requirements.txt
        
      - name: 4. Test Project
        run: python -c "print('CI Passed')"
